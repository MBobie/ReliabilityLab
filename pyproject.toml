[project]
name = "reliabilitylab"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "mbobie", email = "bobbieamankwatia@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "datasets>=5.0.1",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.0",
    "typer>=0.27.1",
]

[project.scripts]
reliabilitylab = "reliabilitylab:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]
